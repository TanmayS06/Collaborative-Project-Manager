name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: syncsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/syncsphere_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: syncsphere_jwt_secret_dev_key_super_secure_2026
      PORT: 5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          cd server && (npm ci || npm install)
          cd ../client && (npm ci || npm install)

      - name: Generate Prisma Client
        run: |
          cd server
          npm run prisma:generate

      - name: Run Prisma Migrations
        run: |
          cd server
          npx prisma db push --skip-generate

      - name: Run Vitest Unit & Integration Suites
        run: |
          cd server
          npm test

      - name: Build Web Application Bundles
        run: |
          cd server && npm run build
          cd ../client && npm run build
